[workspace]
resolver = "3"
members = ["crates/sim", "crates/app"]
# Throwaway prototypes keep their own workspace.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
png = "0.18"
# Save files. (bincode, named in the design doc, was abandoned in 2025; its last release is a compile error.)
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# Scenario files: readable and editable by hand.
toml = "1.1"

# Usable debug builds: our code lightly optimised, dependencies fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
