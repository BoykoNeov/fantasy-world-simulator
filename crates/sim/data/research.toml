# Research "tree" (build step 9): realms study techs and learn them. The defaults a new world gets;
# a world's own copy is saved with it, so editing this file changes new worlds only.
#
# Each month a realm studies the tech it has chosen. A tech costs `years` of study for a realm as
# big as the world's middle realm (by people) with an ordinary ruler. Bigger realms learn faster,
# but less than in proportion (people to the power `size_power`, at most `size_cap` times as fast);
# an able ruler speeds study up, an inept one slows it down. A tech that neighbouring realms or trade
# partners already know is cheaper. When a tech is learned the realm chooses its next one at random
# among those whose `needs` it knows, the cheapest most often.
#
# What techs do: each tech's `effects`, each a share added to the realm's factor for that effect
# (a realm knowing two techs of +0.05 harvest harvests 1.10 times as much). The effects:
#   harvest   bigger harvests (food, and goods gathered with the harvest)
#   made      more goods made (those not gathered with the harvest; in a world with coins)
#   strength  land soldiers stronger: they deal more and take more to kill
#   siege     sieges faster: the days a siege needs are divided by the factor
#   ships     ships stronger
#   calm      unrest rises more slowly: what hunger, occupation and foreign rule add is divided
# A province uses its owner's knowledge (also while an enemy occupies it), an army its realm's. The
# trade techs have no effects of their own yet: they lead to others.

# How fast every realm studies: a middle-sized realm with an ordinary ruler studies this many years
# of a tech's cost each year.
speed = 0.6
# How much faster a bigger realm studies: its people against the middle realm's, to this power
# (0: every realm alike; 1: in proportion to its people)...
size_power = 0.5
# ...and at most this many times as fast as the middle realm.
size_cap = 2.0
# A ruler of the highest ability (100) studies this share faster, one of the lowest (0) this share
# slower; an ordinary one (50), or none, neither.
ruler_effect = 0.25
# A tech every neighbour (and trade partner) knows costs this share less; one some of them know, in
# proportion.
neighbour_discount = 0.5
# A trade partner counts this much against a neighbour's 1 in that share (a realm that is both counts
# as a neighbour). 0: trade passes on no knowledge. Partners are the realms it traded with across
# its border last month, so only an economy with trade has them.
trade_weight = 0.5
# In a world with coins, this share of the people are scholars, each paid `wage` coins a year from
# the treasury, a twelfth each month, into their provinces. A realm short of coins pays what it has
# (after everything else it pays), and scholars unpaid don't study. Without coins, knowledge comes
# from the people and costs nothing.
scholar_share = 0.005
wage = 24.0

# The six fields of knowledge, each tech in one.
fields = ["farming", "crafts", "trade", "war", "sea", "learning"]

# "Discoveries have effects": leave this table out and techs do nothing. Every effect's size is
# multiplied by `scale` (1: as listed; 0: nothing; 2: double).
[effects]
scale = 1.0

# The techs, by name: their field, their cost in years of study, and the techs a realm must know
# before it can study them. About 300 years in all, so no realm learns them all in 150 years.

