# Which module versions work together: written by `combos --write`, read by the window.
# Verdicts depend only on the versions and the seed; see crates/sim/src/combos.rs.

[settings]
n = 48
provinces = 200
years = 20
seeds = [1, 2, 3]

[[mix]]
versions = "terrain=noise climate=latitude economics=food population=basic weather=droughts realms=basic characters=rulers diplomacy=treaties warfare=campaigns research=off culture=off"
verdict = "yellow"

[[mix.run]]
seed = 1
verdict = "green"
finding = []

[[mix.run]]
seed = 2
verdict = "yellow"

[[mix.run.finding]]
problem = "stuck_at_top"
day = 4488
what = "province.unrest of 195 held at its bound 1000 for 180 days"
known = "Unrest stays at the line (1,000) while a province starves on: it reaches the line, rises up, and stays there while the hunger lasts (the uprising lasts as long as the famine). Seen in the flagged runs (Oct 17, when realms first joined the tester): ordinary provinces, neither capitals nor occupied, of about a million people losing 4 to 15% of them a month, in the test drought (seed 3, from day 848) and in the world's own famine (seed 2, year 12). The rule as designed: unrest halves in two quiet years."

