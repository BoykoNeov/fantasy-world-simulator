# Which module versions work together: written by `combos --write`, read by the window.
# Verdicts depend only on the versions and the seed; see crates/sim/src/combos.rs.

[settings]
n = 48
provinces = 200
years = 20
seeds = [1, 2, 3]

[[mix]]
versions = "terrain=noise climate=latitude economics=food population=basic weather=droughts realms=basic characters=rulers diplomacy=treaties warfare=troops"
verdict = "yellow"

[[mix.run]]
seed = 1
verdict = "green"
finding = []

[[mix.run]]
seed = 2
verdict = "yellow"

[[mix.run.finding]]
problem = "stuck_at_top"
day = 4488
what = "province.unrest of 195 held at its bound 1000 for 180 days"
known = "Unrest stays at the line (1,000) while a province that has risen up, or can't rise (a capital, occupied land), goes on starving: the uprising lasts as long as the hunger. Each test world gets a drought, so famines last months. Found at step 7's checks (Oct 17), when realms first joined the tester; the rule as designed (unrest halves in two quiet years)."

