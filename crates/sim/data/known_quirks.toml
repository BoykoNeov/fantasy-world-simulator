# Known quirks: problems a mix of module versions is known to have. The combination tester shows a
# matching finding as yellow (known) instead of red. Each entry:
#
# [[quirk]]
# when = ["economics=food", "weather=off"]   # versions the mix must have
# problem = "all_gone"                         # crash, contract_violated, conservation_broken,
#                                              # stuck_at_top, all_gone, stagnant or expectation
# field = "province.unrest"                   # only findings about this field (may be left out)
# note = "why, or where it is tracked"

[[quirk]]
when = ["realms=basic"]
problem = "stuck_at_top"
field = "province.unrest"
note = "Unrest stays at the line (1,000) while a province starves on: it reaches the line, rises up, and stays there while the hunger lasts (the uprising lasts as long as the famine). Seen in the flagged runs (Oct 17, when realms first joined the tester): ordinary provinces, neither capitals nor occupied, of about a million people losing 4 to 15% of them a month, in the test drought (seed 3, from day 848) and in the world's own famine (seed 2, year 12). The rule as designed: unrest halves in two quiet years. Also (Oct 18, once every part of logistics was on by default): a province held by an enemy for years, its unrest at the line, can't rise up (an occupied province doesn't), so its unrest stays there until the occupation ends (tester world seed 11, province 14, from day 1816)."
