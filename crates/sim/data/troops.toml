# Warfare "troops" (build step 7): the kinds of troops and how provinces raise them. The defaults a
# new world gets; a world's own copy is saved with it, so editing this file changes new worlds only.
#
# Every province a realm holds keeps some of its people under arms: a share in peace, standing at
# home, and a bigger share while its realm is at war, which marches. Soldiers are people taken from the pops; they eat where
# they stand, and the hungry desert home. An army entry is a company: soldiers of one kind from one
# province.

# Share of a province's people (soldiers from it included) under arms in peace, and while its realm
# is at war with anyone.
peace_share = 0.005
war_share = 0.05
# Raising goes at most this fast: each month a province raises up to the war-time number divided by
# this.
months_to_raise = 3.0
# Soldiers go home only once a province has more than this much over the number wanted (a quarter
# more), and then down to that number, so a few people dying or being born doesn't send soldiers
# back and forth every month.
disband_slack = 0.25
# Likewise a province raises only once it has less than this share of the number wanted (nine
# tenths), and then up to that number: soldiers dying of age don't make it raise a few every month.
raise_below = 0.9
# Of the soldiers left unfed in a month, the share who desert home.
desert_share = 0.5
# Soldiers die of age and illness as civilians do, and the hungry who stay die as hungry civilians
# do (share of the unfed, per 30 days). The same as Population's defaults.
deaths_per_year = 0.028
starvation_deaths = 0.3
# Under an economy with coins: coins a realm pays from its treasury into a province for each soldier
# raised there (people start with 20 coins each). A treasury short of coins pays what it has.
bounty = 10.0
# The class of the goods tree whose goods are coins.
money = "money"
# The kind raised in place of a kind whose goods the province can't supply. It needs no goods.
fallback = "levies"
# The class of the troop tree whose kinds are ships: they move by sea, fight only ships, and carry
# land troops across the sea.
sea = "sea"

# Moving and fighting. Guards (the peace-time share) stay home; field companies (the rest of the
# war-time share) march under their realm's general, who gathers them in its provinces next to a
# target and sends them in together once they outmatch the enemies standing there.
#
# A province where soldiers gather takes its realm's field soldiers up to this share of its people,
# so its food isn't stretched more than about this much.
gather_share = 0.1
# The general attacks when it sends this many times the strength of the enemies standing in the
# target, counting their edge on their own land.
outmatch = 1.2
# Each day of battle a side loses this share of the other side's strength (in strength: a soldier
# killed is their kind's strength lost); each side's blows are up to `luck` stronger or weaker at
# random, and the side on its own land deals `home_edge` more.
battle_rate = 0.03
luck = 0.25
home_edge = 0.25
# A side breaks once it has lost this share of the soldiers it fought with: its field companies fall
# back to the nearest province of their own where no enemy stands, and aren't sent to attack for
# `rest_days`; its guards go back to the people.
break_share = 0.3
rest_days = 10
# Soldiers standing alone in an enemy province besiege it, and occupy it after
# siege_base_days × (1 + its people / the people of the world's middle province) days, times
# capital_siege for a capital, and then at most siege_max_days: about a month for a small province,
# two for a middling one. Freeing a province of one's own takes free_siege of that. Besiegers fewer
# than siege_min_share of its people make no progress. A capital holds out no longer than any
# province (1; it was 2 until step 7's checks, when rich capitals were found never to fall).
siege_base_days = 30.0
capital_siege = 1.0
siege_max_days = 180.0
free_siege = 0.5
siege_min_share = 0.01

# Logistics and support (build step 8): four parts, each switched on by its own table here, off
# while it is absent (Warfare "campaigns" is "troops" with all four). Off in new worlds for now.
# With the shipped numbers, they read:
#
# [supply]          # supply lines and foraging
# reach_ways = 2        # fed from home along a line up to this many provinces beyond their own land
# carry_loss = 0.02     # of the food carried, lost each day of the way
# forage_take = 2.0     # beyond, foragers take this many times what they eat (first, on enemy land)
# camp_disease = 0.01   # away from their own land, this share of the soldiers die each month
#
# [seasons]         # winter
# start_lat = 25.0      # winter from this many degrees from the equator,
# full_span = 30.0      # full this many degrees further,
# deepest = 0.05        # deepest at this share of the year in the north (half a year later south)
# road_slow = 2.0       # in the deepest winter: marches take this many times as long,
# deaths = 0.03         # this share of soldiers away from home die each month,
# forage_loss = 0.75    # foragers find this share less,
# no_attack = 0.6       # and no new attack begins on a province whose winter is deeper than this
#
# [pay]             # soldiers' pay, where the world keeps coins
# wage = 1.0            # coins each soldier, guards too, a month, into the soldier's home province
# unpaid_desert = 0.25  # of the soldiers left unpaid, the share who desert home
#
# [sieges]          # sieges in depth
# raising = 0.0         # a besieged province raises this share of its soldiers
# strip = 0.25          # the besiegers strip this share of its food store each month (first)
# starving_days = 30.0  # with food for fewer days than this it is starving,
# starving_speed = 3.0  # and each day of its siege counts this many
# plunder = 0.2         # where the world keeps coins: the share of its coins its taker carries off
#
# [massing]         # armies acting together (a fifth part, not yet in "campaigns")
# join_days = 60        # a group not set off this many days after it was formed is given up
# mass_share = 0.6      # no group takes more than this share of its realm's free soldiers

# The troop tree, written like the goods tree. Its leaves are the kinds; the classes split troops on
# land from those at sea (fleets).
[tree]
root = "troops"

[tree.children]
troops = ["land", "sea"]
land = ["foot", "horse"]
foot = ["levies", "heavy_infantry"]
horse = ["cavalry"]
sea = ["ships"]

[tree.units]
troops = "soldiers"
sea = "crew"

# One table per kind. A province raises each kind in proportion to its `weight` times the share of
# its land that suits it (`land`: "ore" for land with ore in reach, "grazing" for food better from
# herds, "woodland"; none for any land). `coast`: only provinces with a shore raise it. Under an
# economy that keeps goods, each soldier raised uses up `per_soldier` of `good`; without them the
# land alone decides. `strength`: a soldier's strength in battle (ships' only against ships);
# `speed`: a way's days are divided by it, and a group goes at its slowest; `carry`: for ships, the
# soldiers each crewman takes across the sea.
[kinds.levies]
weight = 1.0
strength = 1.0

[kinds.heavy_infantry]
weight = 0.5
land = "ore"
good = "tools"
per_soldier = 1.0
strength = 3.0

[kinds.cavalry]
weight = 0.5
land = "grazing"
strength = 2.0
speed = 1.5

[kinds.ships]
weight = 0.3
land = "woodland"
coast = true
good = "timber"
per_soldier = 1.0
strength = 1.0
carry = 5.0
