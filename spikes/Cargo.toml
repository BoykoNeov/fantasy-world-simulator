[workspace]
resolver = "3"
members = ["spike_world", "spike_egui", "spike_bevy"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Usable debug builds: our code lightly optimised, dependencies fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
